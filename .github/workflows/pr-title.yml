name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      # Pull requests are squash-merged with the title as the commit subject,
      # so the title must follow Conventional Commits. Same types as
      # scripts/commit-msg.sh.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          requireScope: false
